name: Deploy to GitHub Pages

# 不用 GitHub Pages 的 "legacy" 构建器（它一直 Page build failed），
# 改成 Actions 直接把这个仓库根目录当静态产物发布。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 2026-11-21：不再把仓库根目录整个发布。README / .github / supabase / scripts
      # 以前都能从 Pages 直接下载（渗透测试 P1-4）。
      - name: Build static artifact
        run: |
          mkdir -p _dist
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude '_dist' \
            --exclude 'README.md' --exclude 'readme.md' \
            --exclude 'supabase' --exclude 'scripts' --exclude 'keys' \
            --exclude '.secrets' --exclude 'node_modules' \
            ./ _dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4