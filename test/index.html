<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>调试入口 · 八班树洞</title>
<style>
  html { background: #14141a; color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.8;
    color: #b6b2c2;
    background: #14141a;
  }
  .box { max-width: 28rem; text-align: center; }
  p { margin: 0 0 12px; }
  a { color: #bda6ec; }
</style>
<script>
// 调试入口：给目标地址加 ?t=<Date.now()>，绕过 GitHub Pages 的缓存。
// 只接受同源地址，避免被当成任意跳转页使用。
(function () {
  var raw = '../';
  var m = (location.search || '').match(/[?&]to=([^&]*)/);
  if (m) raw = decodeURIComponent(m[1].replace(/\+/g, ' '));

  var to = '../';
  try {
    var u = new URL(raw, location.href);
    if (u.origin === location.origin) to = u.pathname + u.search + u.hash;
  } catch (e) {
    to = '../';
  }

  var hash = '';
  var hi = to.indexOf('#');
  if (hi >= 0) {
    hash = to.slice(hi);
    to = to.slice(0, hi);
  }
  var joiner = to.indexOf('?') >= 0 ? '&' : '?';
  location.replace(to + joiner + 't=' + Date.now() + hash);
})();
</script>
</head>
<body>
<div class="box">
  <p>正在绕过缓存，跳转页面……</p>
  <p>如果没有自动跳转，<a href="../">点这里回树洞</a>。</p>
</div>
</body>
</html>
